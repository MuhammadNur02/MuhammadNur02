name: Update profile assets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "data/arsenal.json", "fonts/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - name: Fetch live GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_github_data.py
      - name: Regenerate SVGs
        run: |
          python scripts/gen_contribution_path.py
          python scripts/gen_battle_stats.py
          python scripts/gen_jutsu_share.py
          python scripts/gen_slash_matrix.py
          python scripts/gen_arsenal.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          git diff --staged --quiet || git commit -m "chore: refresh profile assets"
          git push
